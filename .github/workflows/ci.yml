name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  go-check:
    uses: netresearch/.github/.github/workflows/go-check.yml@main
    with:
      enable-smoke-fast-feedback: true
      enable-fuzz: true
      enable-license-check: true
      enable-codecov: true
      enable-integration-tests: true
      # The threshold is enforced over `test-packages`, so that input decides the
      # population it describes. It was ./..., which put examples/ and testutil/
      # into the figure — the population codecov.yml has always ignored, and the
      # one whose comment there records examples dragging the project total to
      # 19.36%. The old 79 was calibrated on that mixture: measured on 6df052c,
      # ./... gives 80.3% while the library alone gives 77.8%, so 79 was never
      # the library's number — the library sat over a point under it.
      #
      # It is the library's number now. 78 sits just under the 78.4% this branch
      # measures — up from 77.8% because the fabricated example-server data is
      # gone and the tests exercise real paths instead.
      #
      # examples/ stays compiled and linted, since go build and golangci-lint run
      # over ./... regardless. Its three remaining smoke tests no longer run in
      # this job; they cover example source, not library source, which is why
      # they were never what this gate is for. Integration coverage continues to
      # go to Codecov under its own flag.
      test-packages: "."
      coverage-threshold: 78
    permissions:
      contents: read
      security-events: write
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # go-check derives its Go version from the `toolchain` line in go.mod, so it
  # only ever exercises one release. This library's go.mod declares `go 1.26.0`
  # as the minimum, which is a promise to consumers that nothing here gates it.
  # This job is what holds that promise: it builds and runs the unit tests under
  # every supported release with GOTOOLCHAIN=local, so the pinned toolchain
  # cannot silently upgrade the runner out from under the oldest version.
  go-compat:
    name: Go ${{ matrix.go }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.8', '1.27.1']
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: false
          # This workflow also runs on tag pushes, so a build cache written
          # here would be reachable from a release context (zizmor
          # cache-poisoning). The job is short; skip the cache.
          cache: false

      - name: Report the toolchain actually in use
        env:
          GOTOOLCHAIN: local
        run: go version

      - name: Build
        env:
          GOTOOLCHAIN: local
        run: go build ./...

      - name: Vet
        env:
          GOTOOLCHAIN: local
        run: go vet ./...

      - name: Unit tests
        env:
          GOTOOLCHAIN: local
        run: go test -short -race -timeout=300s ./...

  # The guides are prose, not compiled, so nothing else notices when they name a
  # method that does not exist or call a real one with the wrong arity. Both had
  # happened: 48 dead call sites and 2 wrong arities, found only by hand.
  docs-api:
    name: Documentation matches the API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check documented calls against go doc
        run: python3 scripts/check-docs-api.py --verbose
