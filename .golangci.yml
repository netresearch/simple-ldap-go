# golangci-lint configuration for simple-ldap-go library
# Configuration format for golangci-lint v2.5+

version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true

linters:
  # Use standard set of linters
  default: standard
  disable:
    - funlen # Some functions require more lines for LDAP operations

# gofmt is not part of `linters.default: standard`, so nothing enforced it and
# four files had drifted out of format. Enabling it here makes `golangci-lint
# run` — the gate the shared go-check workflow already runs — reject the next one.
formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
